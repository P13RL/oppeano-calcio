<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oppeano Calcio - Intervallo</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page">
    <!-- Metà sinistra -->
    <div class="left">
      <div class="content">
        <div class="iframe-wrapper" id="scroll-container-left">
            <iframe src="https://www.tuttocampo.it/WidgetV2/Classifica/c2b6092e-75d7-4c27-aed9-e841335e45de" frameborder="0" loading="lazy"> </iframe>
        </div>
        <div class="sponsor-carousel">
            <img id="sponsor-left" src="img/sponsor/AB.jpg" alt="Sponsor sinistra"/>
            <img id="sponsor-right" src="img/sponsor/Ballottin Luciano Sas.jpg" alt="Sponsor destra" />
        </div>
      </div>
    </div>

    <!-- Metà destra specchiata -->
    <div class="right">
      <div class="content">
        <div class="iframe-wrapper" id="scroll-container-right">
            <iframe src="https://www.tuttocampo.it/WidgetV2/Classifica/c2b6092e-75d7-4c27-aed9-e841335e45de" frameborder="0" loading="lazy"></iframe>
        </div>
        <div class="sponsor-carousel">
          <img id="sponsor-left-mirror" src="img/sponsor/AB.jpg" alt="Sponsor sinistra" class="unmirrored"/>
          <img id="sponsor-right-mirror" src="img/sponsor/Ballottin Luciano Sas.jpg" alt="Sponsor destra" class="unmirrored"/>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
