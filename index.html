<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Specchio Live</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page">
    <!-- Metà sinistra -->
    <div class="left">
      <div class="content">
        <div class="logos">
          <img src="img/loghi_squadre/oppeano.png" alt="Logo Squadra 1" class="team-logo" />
          <div class="score live-widget">
             <iframe src="https://www.tuttocampo.it/Veneto/Eccellenza/GironeA/Squadra/Oppeano/780669/Scheda" width="350" height="250" frameborder="0" scrolling="no" style="border: none; overflow: hidden;"></iframe>
</div>
          <img src="img/loghi_squadre/oppeano.png" alt="Logo Squadra 2" class="team-logo" />
        </div>

        <div class="sponsor-carousel">
          <img id="sponsor-img" src="img/sponsor/1.jpeg" alt="Sponsor" />
        </div>
      </div>
    </div>

    <!-- Metà destra specchiata -->
    <div class="right">
      <div class="content mirrored">
        <div class="logos">
          <img src="img/loghi_squadre/oppeano.png" alt="Logo Squadra 1" class="team-logo" />
          <div class="score">
            <h1>2 - 1</h1>
            <p>Live - 65'</p>
          </div>
          <img src="img/loghi_squadre/oppeano.png" alt="Logo Squadra 2" class="team-logo" />
        </div>

        <div class="sponsor-carousel">
          <img id="sponsor-img-mirror" src="img/sponsor/1.jpeg" alt="Sponsor" class="unmirrored"/>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
