<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oppeano Calcio</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page">
    <!-- Metà sinistra -->
    <div class="left">
      <div class="content">
        <div class="score live-widget">
         <iframe src='https://www.tuttocampo.it/WidgetV2/Partita/c869d486-70f7-4c2a-97fe-12795ba4afbf' scrolling='no' frameborder='0' loading='lazy'></iframe>
        </div>
        <div class="sponsor-carousel">
          <img id="sponsor-left" src="img/sponsor/AB.jpg" alt="Sponsor sinistra"/>
        </div>
      </div>
    </div>

    <!-- Metà destra specchiata -->
    <div class="right">
      <div class="content">
        <div class="score live-widget">
         <iframe src='https://www.tuttocampo.it/WidgetV2/Partita/c869d486-70f7-4c2a-97fe-12795ba4afbf' scrolling='no' frameborder='0' loading='lazy'></iframe>
        </div>
        <div class="sponsor-carousel">
          <img id="sponsor-left-mirror" src="img/sponsor/AB.jpg" alt="Sponsor sinistra" class="unmirrored"/>
        </div>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
