<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Specchio Live</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page">
    <!-- Metà sinistra -->
    <div class="left">
      <div class="content">
        <div class="logos">
          <img src="img/loghi_squadre/acd_oppeano.jpg" alt="Logo Squadra 1" class="team-logo" />
          <div class="score live-widget">
            <iframe src='https://www.tuttocampo.it/WidgetV2/Partita/c2b6092e-75d7-4c27-aed9-e841335e45de' scrolling='no' frameborder='0' loading='lazy' class="live-widget iframe"></iframe>
          </div>
          <img src="img/loghi_squadre/acd_oppeano.jpg" alt="Logo Squadra 2" class="team-logo" />
        </div>

        <div class="sponsor-carousel">
          <img id="sponsor-img" src="img/sponsor/AB.jpg" alt="Sponsor" />
        </div>
      </div>
    </div>

    <!-- Metà destra specchiata -->
    <div class="right">
      <div class="content mirrored">
        <div class="logos">
          <img src="img/loghi_squadre/acd_oppeano.jpg" alt="Logo Squadra 1" class="team-logo-unmirrored"/>
          <div class="score live-widget">
            <iframe src='https://www.tuttocampo.it/WidgetV2/Partita/c2b6092e-75d7-4c27-aed9-e841335e45de' scrolling='no' frameborder='0' loading='lazy' class="live-widget iframe"></iframe>
          </div>
          <img src="img/loghi_squadre/acd_oppeano.jpg" alt="Logo Squadra 2" class="team-logo-unmirrored" />
        </div>

        <div class="sponsor-carousel">
          <img id="sponsor-img-mirror" src="img/sponsor/AB.jpg" alt="Sponsor" class="unmirrored"/>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
